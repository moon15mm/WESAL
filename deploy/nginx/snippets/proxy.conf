proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite: clients cannot spoof their IP
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id      $request_id;
proxy_set_header Connection        "";
proxy_connect_timeout 5s;
proxy_read_timeout    120s;  # report exports can take a while
proxy_send_timeout    60s;
proxy_hide_header X-Powered-By;
# Nginx sets these itself (snippets/security-headers.conf); drop upstream copies to avoid duplicates
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
