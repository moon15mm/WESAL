user  nginx;
worker_processes  auto;
pid        /var/run/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    charset utf-8;

    log_format main escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                                '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
                                '"upstream_rt":"$upstream_response_time","ua":"$http_user_agent","req_id":"$request_id"}';
    access_log /var/log/nginx/access.log main;   # query strings are not logged (may contain tokens)

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;
    client_max_body_size 10m;   # backend limit is 8 MB per upload

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/manifest+json;

    # rate limits (per client IP) — the API additionally rate-limits per account in Redis
    limit_req_zone  $binary_remote_addr zone=api:20m   rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m  rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Docker's DNS; upstreams are re-resolved when containers are recreated on deploy (nginx >= 1.27.3)
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream wesal_api      { zone wesal_api 64k;      server api:8000 resolve;      keepalive 32; }
    upstream wesal_frontend { zone wesal_frontend 64k; server frontend:3000 resolve; keepalive 32; }

    include /etc/nginx/conf.d/*.conf;
}
