# Local development services only (run the API with uvicorn and the web app with `npm run dev`).
#   docker compose up -d
#   cd backend && alembic upgrade head && python -m app.cli seed-reference
name: wesal-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wesal
      POSTGRES_USER: wesal_owner
      POSTGRES_PASSWORD: wesal_owner
      DB_APP_PASSWORD: wesal_app
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - devpg:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wesal_owner -d wesal"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]

volumes:
  devpg:
